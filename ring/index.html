<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>SVG 圆环进度条</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7fb;
        color: #172033;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .demo {
        width: min(92vw, 360px);
        display: grid;
        gap: 28px;
        justify-items: center;
      }

      .ring {
        --percent: 100;
        --size: 190px;
        --stroke: 16px;
        --track: #e3e7ef;
        --fill: #1f8a70;
        --duration: 10s;

        width: var(--size);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        justify-self: center;
        position: relative;
      }

      .ring__svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }

      .ring__track,
      .ring__bar {
        fill: none;
        stroke-width: var(--stroke);
      }

      .ring__track {
        stroke: var(--track);
      }

      .ring__bar {
        stroke: var(--fill);
        stroke-dasharray: 100;
        stroke-dashoffset: calc(100 - var(--percent));
      }

      .ring.is-full .ring__bar {
        stroke-dasharray: none;
        stroke-dashoffset: 0;
      }

      .ring.is-empty .ring__bar {
        stroke: transparent;
      }

      .ring__value {
        position: absolute;
        inset: calc(var(--stroke) + 10px);
        display: grid;
        gap: 4px;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        box-shadow: inset 0 0 0 1px rgba(23, 32, 51, 0.04);
        line-height: 1;
      }

      .ring__number {
        font-size: 34px;
        font-weight: 750;
      }

      .ring__label {
        color: #697386;
        font-size: 14px;
      }

      .start-button {
        height: 48px;
        border: 1px solid #d8dde8;
        border-radius: 8px;
        background: #fff;
        color: #172033;
        font: inherit;
        font-weight: 650;
        padding: 0 22px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
      }

      .start-button:active {
        transform: translateY(1px);
      }

      .start-button:focus-visible {
        outline: 3px solid rgba(31, 138, 112, 0.22);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <div class="ring is-full" id="ring" aria-label="进度 100%">
        <svg class="ring__svg" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring__track" cx="60" cy="60" r="50" pathLength="100" />
          <circle class="ring__bar" cx="60" cy="60" r="50" pathLength="100" />
        </svg>
        <div class="ring__value">
          <strong class="ring__number" id="ringValue">100%</strong>
          <span class="ring__label">完成</span>
        </div>
      </div>

      <button class="start-button" type="button" id="startButton">开始倒计时</button>
    </main>

    <script>
      const ring = document.querySelector("#ring");
      const ringValue = document.querySelector("#ringValue");
      const startButton = document.querySelector("#startButton");
      let currentProgress = 100;
      let animationId = 0;
      let displayedProgress = 100;

      function clampProgress(value) {
        const progress = Number(value);

        if (Number.isNaN(progress)) {
          return 0;
        }

        return Math.min(100, Math.max(0, Math.round(progress)));
      }

      function getDuration() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          return 1;
        }

        const duration = getComputedStyle(ring).getPropertyValue("--duration").trim();
        const value = parseFloat(duration);

        if (duration.endsWith("ms")) {
          return value;
        }

        if (duration.endsWith("s")) {
          return value * 1000;
        }

        return 500;
      }

      function easeOutCubic(progress) {
        return 1 - Math.pow(1 - progress, 3);
      }

      function renderProgress(progress) {
        const displayProgress = Math.round(progress);
        const visualProgress = displayProgress <= 0 ? 0 : progress;

        ring.classList.toggle("is-full", visualProgress >= 99.999);
        ring.classList.toggle("is-empty", visualProgress <= 0);
        ring.style.setProperty("--percent", visualProgress.toFixed(3));

        if (displayProgress !== displayedProgress) {
          displayedProgress = displayProgress;
          ring.setAttribute("aria-label", `进度 ${displayProgress}%`);
          ringValue.textContent = `${displayProgress}%`;
        }
      }

      function setProgress(value) {
        const targetProgress = clampProgress(value);
        const startProgress = currentProgress;
        const distance = targetProgress - startProgress;
        const duration = getDuration();
        const startTime = performance.now();

        cancelAnimationFrame(animationId);

        function animate(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easedProgress = easeOutCubic(progress);
          const nextProgress = startProgress + distance * easedProgress;

          currentProgress = nextProgress;
          renderProgress(nextProgress);

          if (progress < 1) {
            animationId = requestAnimationFrame(animate);
          } else {
            currentProgress = targetProgress;
            renderProgress(targetProgress);
          }
        }

        animationId = requestAnimationFrame(animate);
      }

      startButton.addEventListener("click", () => {
        renderProgress(100);
        currentProgress = 100;
        setProgress(0);
      });
    </script>
  </body>
</html>
