<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Canvas 圆环进度条</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7fb;
        color: #172033;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .demo {
        width: min(92vw, 360px);
        display: grid;
        gap: 28px;
        justify-items: center;
      }

      .ring {
        --size: 190px;
        --stroke: 16px;
        --track: #e3e7ef;
        --fill: #1f8a70;
        --duration: 10s;

        width: var(--size);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        justify-self: center;
        position: relative;
      }

      .ring__canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .ring__value {
        position: absolute;
        inset: calc(var(--stroke) + 10px);
        display: grid;
        gap: 4px;
        place-items: center;
        border-radius: 50%;
        background: #fff;
        box-shadow: inset 0 0 0 1px rgba(23, 32, 51, 0.04);
        line-height: 1;
      }

      .ring__number {
        font-size: 34px;
        font-weight: 750;
      }

      .ring__label {
        color: #697386;
        font-size: 14px;
      }

      .start-button {
        height: 48px;
        border: 1px solid #d8dde8;
        border-radius: 8px;
        background: #fff;
        color: #172033;
        font: inherit;
        font-weight: 650;
        padding: 0 22px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(23, 32, 51, 0.08);
      }

      .start-button:active {
        transform: translateY(1px);
      }

      .start-button:focus-visible {
        outline: 3px solid rgba(31, 138, 112, 0.22);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="demo">
      <div class="ring" id="ring" aria-label="进度 100%">
        <canvas class="ring__canvas" id="ringCanvas" aria-hidden="true"></canvas>
        <div class="ring__value">
          <strong class="ring__number" id="ringValue">100%</strong>
          <span class="ring__label">完成</span>
        </div>
      </div>

      <button class="start-button" type="button" id="startButton">开始倒计时</button>
    </main>

    <script>
      const ring = document.querySelector("#ring");
      const canvas = document.querySelector("#ringCanvas");
      const context = canvas.getContext("2d");
      const ringValue = document.querySelector("#ringValue");
      const startButton = document.querySelector("#startButton");
      let currentProgress = 100;
      let animationId = 0;
      let displayedProgress = 100;

      function clampProgress(value) {
        const progress = Number(value);

        if (Number.isNaN(progress)) {
          return 0;
        }

        return Math.min(100, Math.max(0, Math.round(progress)));
      }

      function getRingOptions() {
        const styles = getComputedStyle(ring);

        return {
          size: parseFloat(styles.getPropertyValue("--size")),
          stroke: parseFloat(styles.getPropertyValue("--stroke")),
          track: styles.getPropertyValue("--track").trim(),
          fill: styles.getPropertyValue("--fill").trim(),
        };
      }

      function getDuration() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          return 1;
        }

        const duration = getComputedStyle(ring).getPropertyValue("--duration").trim();
        const value = parseFloat(duration);

        if (duration.endsWith("ms")) {
          return value;
        }

        if (duration.endsWith("s")) {
          return value * 1000;
        }

        return 500;
      }

      function easeOutCubic(progress) {
        return 1 - Math.pow(1 - progress, 3);
      }

      function resizeCanvas() {
        const { size } = getRingOptions();
        const pixelRatio = window.devicePixelRatio || 1;
        const canvasSize = Math.round(size * pixelRatio);

        canvas.width = canvasSize;
        canvas.height = canvasSize;
        canvas.style.width = `${size}px`;
        canvas.style.height = `${size}px`;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function drawRing(progress) {
        const { size, stroke, track, fill } = getRingOptions();
        const center = size / 2;
        const radius = (size - stroke) / 2;
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + Math.PI * 2 * (progress / 100);

        context.clearRect(0, 0, size, size);
        context.lineWidth = stroke;
        context.lineCap = "round";

        context.beginPath();
        context.strokeStyle = track;
        context.arc(center, center, radius, 0, Math.PI * 2);
        context.stroke();

        if (progress <= 0) {
          return;
        }

        context.beginPath();
        context.strokeStyle = fill;
        context.arc(center, center, radius, startAngle, endAngle);
        context.stroke();
      }

      function renderProgress(progress) {
        const displayProgress = Math.round(progress);

        drawRing(progress);

        if (displayProgress !== displayedProgress) {
          displayedProgress = displayProgress;
          ring.setAttribute("aria-label", `进度 ${displayProgress}%`);
          ringValue.textContent = `${displayProgress}%`;
        }
      }

      function setProgress(value) {
        const targetProgress = clampProgress(value);
        const startProgress = currentProgress;
        const distance = targetProgress - startProgress;
        const duration = getDuration();
        const startTime = performance.now();

        cancelAnimationFrame(animationId);

        function animate(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easedProgress = easeOutCubic(progress);
          const nextProgress = startProgress + distance * easedProgress;

          currentProgress = nextProgress;
          renderProgress(nextProgress);

          if (progress < 1) {
            animationId = requestAnimationFrame(animate);
          } else {
            currentProgress = targetProgress;
            renderProgress(targetProgress);
          }
        }

        animationId = requestAnimationFrame(animate);
      }

      startButton.addEventListener("click", () => {
        renderProgress(100);
        currentProgress = 100;
        setProgress(0);
      });

      window.addEventListener("resize", () => {
        resizeCanvas();
        drawRing(currentProgress);
      });

      resizeCanvas();
      drawRing(currentProgress);
    </script>
  </body>
</html>
